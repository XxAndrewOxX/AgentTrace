name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package without a leading v. Defaults to Cargo.toml package.version."
        required: false
        type: string
      publish_draft_release:
        description: "Create or update a draft GitHub Release with the built artifacts."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  e2e:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run non-live E2E suites
        env:
          AGENT_TRACE_ALLOW_DEGRADED: "1"
        run: ./scripts/run_e2e.sh all

  package:
    name: Package ${{ matrix.target }}
    needs:
      - test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/agent-trace
          - os: macos-13
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/agent-trace
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/agent-trace
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/agent-trace.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add "${{ matrix.target }}"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          crate_version="$(python scripts/crate_version.py)"
          requested_version=""
          if [ -n "${{ inputs.version }}" ]; then
            requested_version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "${requested_version}" ] && [ "${requested_version}" != "${crate_version}" ]; then
            echo "Requested release version ${requested_version} does not match Cargo.toml version ${crate_version}." >&2
            exit 1
          fi
          version="${crate_version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Smoke test built binary
        shell: bash
        run: |
          "${{ matrix.binary }}" --version | tee version.txt
          grep " ${{ steps.version.outputs.version }}" version.txt
          "${{ matrix.binary }}" --help

      - name: Package artifact
        shell: bash
        run: python scripts/package_release.py --version "${{ steps.version.outputs.version }}" --target "${{ matrix.target }}"

      - name: Smoke test extracted archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          AGENT_TRACE_ALLOW_DEGRADED: "1"
        run: |
          package_name="agent-trace-v${VERSION}-${TARGET}"
          smoke_dir="${RUNNER_TEMP}/smoke"
          store_dir="${RUNNER_TEMP}/smoke-store"
          rm -rf "${smoke_dir}" "${store_dir}"
          mkdir -p "${smoke_dir}" "${store_dir}"
          export smoke_dir store_dir VERSION TARGET

          if [[ "${TARGET}" == *windows* ]]; then
            archive="dist/${package_name}.zip"
            python scripts/smoke_extract_windows_archive.py
            binary="${smoke_dir}/agent-trace.exe"
          else
            archive="dist/${package_name}.tar.gz"
            (
              cd dist
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum -c "${package_name}.tar.gz.sha256"
              else
                shasum -a 256 -c "${package_name}.tar.gz.sha256"
              fi
            )
            tar xzf "${archive}" -C "${smoke_dir}"
            binary="${smoke_dir}/agent-trace"
          fi

          "${binary}" --version | grep " ${VERSION}"
          "${binary}" --help
          "${binary}" init "${store_dir}"

          if [[ "${TARGET}" != *windows* ]]; then
            init_request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1.0"}}}'
            if command -v timeout >/dev/null 2>&1; then
              response="$(printf '%s\n' "${init_request}" | timeout 10 "${binary}" mcp --path "${store_dir}" --actor smoke-test | head -n 1)"
            else
              response="$(printf '%s\n' "${init_request}" | perl -e 'alarm 10; exec @ARGV' "${binary}" mcp --path "${store_dir}" --actor smoke-test | head -n 1)"
            fi
            echo "${response}" | grep '"result"'
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-trace-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/agent-trace-v${{ steps.version.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error

  cargo-dry-run:
    name: Cargo publish dry run
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo package
        run: cargo publish --dry-run

      - name: Smoke test cargo install path
        run: |
          cargo install --path . --root /tmp/cargo-install-test --locked --force
          /tmp/cargo-install-test/bin/agent-trace --version
          /tmp/cargo-install-test/bin/agent-trace --help

  draft-release:
    name: Draft GitHub Release
    needs:
      - test
      - e2e
      - package
      - cargo-dry-run
    if: github.event_name == 'push' || inputs.publish_draft_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          crate_version="$(python scripts/crate_version.py)"
          requested_version=""
          if [ -n "${{ inputs.version }}" ]; then
            requested_version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "${requested_version}" ] && [ "${requested_version}" != "${crate_version}" ]; then
            echo "Requested release version ${requested_version} does not match Cargo.toml version ${crate_version}." >&2
            exit 1
          fi
          version="${crate_version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          python scripts/extract_changelog_section.py --version "${{ steps.version.outputs.version }}" > release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            cat .github/RELEASE_TEMPLATE.md
          } >> release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [ "${is_draft}" != "true" ]; then
              echo "Refusing to modify published release ${TAG}." >&2
              exit 1
            fi
            gh release upload "${TAG}" release-artifacts/* --clobber
            gh release edit "${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" release-artifacts/* \
              --draft \
              --verify-tag \
              --title "Agent Trace ${TAG}" \
              --notes-file release-notes.md
          fi
