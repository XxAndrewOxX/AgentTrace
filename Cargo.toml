[package]
name = "docmgr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "docmgr"
path = "src/main.rs"

[dependencies]
git2 = "0.19"
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "=1.0.69"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
ratatui = "=0.29.0"
crossterm = "=0.28.1"
dirs-next = "2"

[dev-dependencies]
tempfile = "3"
